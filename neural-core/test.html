<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>E.D.-2 Neural Core — pruebas</title>
  <style>
    body{font:16px system-ui;max-width:850px;margin:32px auto;padding:0 16px;background:#101722;color:#eef}
    button{padding:10px 16px;margin:8px 0;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}
    pre{white-space:pre-wrap;background:#1b2938;padding:14px;border-radius:8px;min-height:180px}
  </style>
</head>
<body>
  <h1>E.D.-2 Neural Core</h1>
  <p>Pruebas locales del prototipo neuronal. No utiliza APIs ni descarga modelos.</p>
  <button id="run">Ejecutar pruebas</button>
  <pre id="log" aria-live="polite">Listo. Pulsa el botón para comenzar.</pre>
  <script type="module">
    import { runCoreTests } from "../js/neural-core/tests.js";
    const log = document.querySelector("#log");
    const button = document.querySelector("#run");
    const write = message => { log.textContent += "\n" + message; };
    button.addEventListener("click", async () => {
      button.disabled = true;
      log.textContent = "Iniciando pruebas…";
      try {
        const report = await runCoreTests(write);
        if (report.failed.length === 0) {
          write("COMPLETADO: las " + report.passed.length + " pruebas han superado la comprobación.");
        } else {
          write("REVISIÓN NECESARIA: " + report.failed.length + " pruebas han fallado. Copia los mensajes marcados con ✗.");
        }
      } catch (error) {
        write("ERROR: " + error.message);
        console.error(error);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
